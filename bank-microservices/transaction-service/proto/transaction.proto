syntax = "proto3";
package transaction;

service TransactionService {
  rpc Transfer         (TransferRequest)          returns (TransactionResponse);
  rpc GetTransaction   (GetTransactionRequest)    returns (TransactionResponse);
  rpc ListTransactions (ListTransactionsRequest)  returns (TransactionListResponse);
  rpc GetHistory       (GetHistoryRequest)        returns (TransactionListResponse);
}

message TransferRequest {
  string from_account = 1;
  string to_account   = 2;
  double amount       = 3;
  string description  = 4;
}

message GetTransactionRequest {
  string id = 1;
}

message ListTransactionsRequest {
  string account_id = 1;
}

message GetHistoryRequest {
  string account_id = 1;
  string date_from  = 2;
  string date_to    = 3;
}

message TransactionResponse {
  string id           = 1;
  string from_account = 2;
  string to_account   = 3;
  double amount       = 4;
  string type         = 5;
  string status       = 6;
  string description  = 7;
  string created_at   = 8;
  string error        = 9;
}

message TransactionListResponse {
  repeated TransactionResponse transactions = 1;
  string error = 2;
}
